else{var best=null,bd=6;cars.forEach(function(c){if(c.rem)return;var d=Math.hypot(c.g.position.x-pl.position.x,c.g.position.z-pl.position.z);if(d<bd){bd=d;best=c}});
if(best){drv=best;best.ai=false;best.v=0;pl.visible=false;btn.textContent='🚶'}}}

function punch(){if(drv||pun>0)return;pun=.35;peds.forEach(function(q){var p=q.o.g.position,dx=p.x-pl.position.x,dz=p.z-pl.position.z,d=Math.hypot(dx,dz);if(d<2.4&&d>.01){q.st=1.6;p.x+=dx/d*1.5;p.z+=dz/d*1.5}})}
fistB.addEventListener('click',punch);
function say(t,ms){var e=document.getElementById('nm');e.textContent=t;clearTimeout(say.t);say.t=setTimeout(function(){e.textContent=''},ms||3000)}
// minimap
var mm=document.getElementById('mini'),mx=mm.getContext('2d'),mmT=0,avs={};
function drawMap(pp){var S=2.1,c=112;mx.setTransform(1,0,0,1,0,0);mx.clearRect(0,0,224,224);mx.save();mx.beginPath();mx.arc(c,c,c,0,7);mx.clip();mx.fillStyle='#4f7d3c';mx.fillRect(0,0,224,224);
mx.translate(c,c);mx.rotate(yaw);mx.lineCap='round';mx.lineJoin='round';
mx.fillStyle='#8a8780';obs.forEach(function(q){if(q.hw<2.3)return;var X=(q.x-pp.x)*S,Y=(q.z-pp.z)*S;if(Math.abs(X)<150&&Math.abs(Y)<150)mx.fillRect(X-q.hw*S,Y-q.hd*S,q.hw*2*S,q.hd*2*S)});
roads.forEach(function(r){mx.strokeStyle=r.w>5?'#e4e2da':'#cfcdc5';mx.lineWidth=Math.max(3,r.w*S*.8);mx.beginPath();r.pts.forEach(function(p,i){var X=(p.x-pp.x)*S,Y=(p.z-pp.z)*S;i?mx.lineTo(X,Y):mx.moveTo(X,Y)});mx.stroke()});
mx.fillStyle='#3a8cff';Object.keys(avs).forEach(function(id){var a=avs[id];mx.beginPath();mx.arc((a.tx-pp.x)*S,(a.tz-pp.z)*S,5,0,7);mx.fill()});
mx.restore();mx.fillStyle='#fff';mx.strokeStyle='#222';mx.lineWidth=2;mx.beginPath();mx.moveTo(c,c-13);mx.lineTo(c+9,c+10);mx.lineTo(c,c+5);mx.lineTo(c-9,c+10);mx.closePath();mx.fill();mx.stroke();
mx.fillStyle='#fff';mx.font='bold 20px sans-serif';mx.textAlign='center';mx.textBaseline='middle';mx.fillText('N',c+Math.sin(yaw)*92,c-Math.cos(yaw)*92)}
// multiplayer free roam: see friends walk and drive (room capability)
var room=null,uc=null,nm={},tick=0;
function mkAv(){var o=mkPerson(0xc0392b,0x2f4a7a);scene.add(o.g);var a={o:o,tx:0,tz:0,th:0,d:-1,ph:0,lab:null,nid:null,cur:null};return a}
function sync(){if(!room)return;var ps=room.peers().filter(function(p){return p.kind==='viewer'&&p.presence&&typeof p.presence.x==='number'&&!p.sameTab}),ids=[];
ps.forEach(function(p,n){var id=p.peer,q=p.presence;ids.push(id);var a=avs[id]||(avs[id]=mkAv());a.tx=q.x;a.tz=q.z;a.th=q.h||0;a.d=typeof q.d==='number'?q.d:-1;
if(a.cur!==q.k){a.cur=q.k;a.o.sh.color.set(q.k||0x888888)}
if(p.by&&uc&&nm[p.by]===undefined){nm[p.by]='';uc.profiles([p.by]).then(function(r){var pr=r&&r[p.by];nm[p.by]=(pr&&pr.name)||'';a.nid=null}).catch(function(){})}
var nid=(p.by&&nm[p.by])||('കളിക്കാരൻ '+(n+1));if(a.nid!==nid){a.nid=nid;if(a.lab)a.o.g.remove(a.lab);a.lab=mkLabel(nid,'rgba(0,0,0,.55)',4.5);a.lab.position.y=3.6;a.o.g.add(a.lab)}});
Object.keys(avs).forEach(function(id){if(ids.indexOf(id)<0){scene.remove(avs[id].o.g);delete avs[id]}});
cars.forEach(function(c){c.rem=false});
Object.keys(avs).forEach(function(id){var a=avs[id];if(a.d>=0&&cars[a.d]){var c=cars[a.d];c.rem=true;c.ai=false;c.tx=a.tx;c.tz=a.tz;c.th=a.th}});
document.getElementById('pc').textContent='👥 '+(ps.length+1)+'/10'}
(async function(){try{if(typeof claude==='undefined')return;room=await claude.use('room');uc=await claude.use('user');if(room)room.onPeers(function(){},function(){})}catch(e){room=null}})();
var hm=document.getElementById('m'),hs=document.getElementById('sp'),hpb=document.querySelector('#hp i'),clk=document.getElementById('clk');
function loop(now){requestAnimationFrame(loop);var dt=Math.min((now-t0)/1000,.05);t0=now;
var ix=dir.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iy=dir.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),m=Math.min(1,Math.hypot(ix,iy));
if(pun>0)pun-=dt;
cars.forEach(function(c){if(c.rem){var p=c.g.position,k=Math.min(1,dt*10);p.x+=(c.tx-p.x)*k;p.z+=(c.tz-p.z)*k;var da=c.th-c.h;da=Math.atan2(Math.sin(da),Math.cos(da));c.h+=da*k;c.g.rotation.y=c.h;return}
if(!c.ai)return;c.s+=c.d*([10,8,11,12][c.type])*dt;if(c.s<0||c.s>c.r0.L){c.d=-c.d;c.s=cl(c.s,0,c.r0.L)}
var p=P(c.r0,c.s),ht=p.h+(c.d<0?PI:0),rx=-Math.cos(ht),rz=Math.sin(ht),o=c.r0.w*.25;c.g.position.set(p.x+rx*o,0,p.z+rz*o);c.h=ht;c.g.rotation.y=ht});
moving=0;
if(drv){var th=cl(-iy,-1,1),st=cl(ix,-1,1),v=drv.v,mx2=drv.type===3?30:drv.type===1?18:26;
if(th*v<0)v+=th*30*dt;else v+=th*14*dt;
if(!th)v-=Math.sign(v)*Math.min(Math.abs(v),8*dt);
v=cl(v,-8,mx2);drv.h-=st*1.9*dt*cl(v/6,-1,1);
var p=drv.g.position;p.x+=Math.sin(drv.h)*v*dt;p.z+=Math.cos(drv.h)*v*dt;
if(push(p,drv.r)){if(Math.abs(v)>10)hp-=Math.abs(v)*.6;v*=.6}
cars.forEach(function(o){if(o!==drv){var q=o.g.position,dx=p.x-q.x,dz=p.z-q.z,d=Math.hypot(dx,dz),md=drv.r+o.r;if(d<md&&d>.01){p.x=q.x+dx/d*md;p.z=q.z+dz/d*md;if(Math.abs(v)>10)hp-=Math.abs(v)*.4;v*=.7}}});
p.x=cl(p.x,BXL,BXH);p.z=cl(p.z,BZL,BZH);drv.v=v;drv.g.rotation.y=drv.h;drv.g.rotation.z=-st*cl(v/40,-.2,.2)*(drv.type===3?1.5:.3);pl.position.set(p.x,0,p.z);moving=Math.abs(v)>.5?1:0;
var df=drv.h+PI-yaw;df=Math.atan2(Math.sin(df),Math.cos(df));yaw+=df*Math.min(1,dt*3);pitch+=(.26-pitch)*Math.min(1,dt*2);
hs.textContent=Math.round(Math.abs(v)*3.6)+' km/h'}
else{hs.textContent='';
if(m>.05){var wa=yaw+Math.atan2(ix,iy),sp=(runOn?13:7)*m*dt,p=pl.position;p.x+=Math.sin(wa)*sp;p.z+=Math.cos(wa)*sp;push(p,.6);
p.x=cl(p.x,BXL,BXH);p.z=cl(p.z,BZL,BZH);var da=wa-ang;da=Math.atan2(Math.sin(da),Math.cos(da));ang+=da*Math.min(1,dt*12);pl.rotation.y=ang;walk+=dt*(runOn?14:9)*m;moving=1}
else walk*=.9}
anim(me,Math.min(1,m*(runOn?1.4:1.1)),walk,pun);
hp=Math.min(100,hp+dt*1.5);if(hp<=0){hp=100;if(drv)act();pl.position.set(spawnP.x,0,spawnP.z);say('ഇടിച്ചു! തുടക്ക സ്ഥലത്തേക്ക് തിരിച്ചെത്തി',3500)}
hpb.style.width=hp+'%';
Object.keys(avs).forEach(function(id){var a=avs[id],g=a.o.g;if(a.d>=0){g.visible=false;return}g.visible=true;var k=Math.min(1,dt*10),dx=a.tx-g.position.x,dz=a.tz-g.position.z,sp=Math.hypot(dx,dz)/Math.max(dt,.001);
if(Math.hypot(dx,dz)>30){g.position.x=a.tx;g.position.z=a.tz}else{g.position.x+=dx*k;g.position.z+=dz*k}
var da=a.th-g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));g.rotation.y+=da*k;a.ph+=dt*10*Math.min(1,sp/8);anim(a.o,Math.min(1,sp/6),a.ph,0)});
peds.forEach(function(q){var g=q.o.g,p=g.position;if(q.st>0){q.st-=dt;anim(q.o,0,0,0);return}
q.t-=dt;if(q.t<0){var a=R()*2*PI;q.dx=Math.sin(a);q.dz=Math.cos(a);q.t=2+R()*4;if(R()<.3){q.dx=q.dz=0}}
p.x+=q.dx*1.6*dt;p.z+=q.dz*1.6*dt;if(push(p,.5))q.t=0;p.x=cl(p.x,BXL,BXH);p.z=cl(p.z,BZL,BZH);if(q.dx||q.dz){g.rotation.y=Math.atan2(q.dx,q.dz);q.ph+=dt*8}anim(q.o,q.dx||q.dz?.8:0,q.ph,0)});
var pp=pl.position;
cash.forEach(function(c){c.rotation.y+=dt*2.5;c.position.y=1.2+Math.sin(now/300+c.position.x)*.15;
if(Math.hypot(c.position.x-pp.x,c.position.z-pp.z)<2.6){money+=100;var s=RS(1.5);c.position.x=s.x;c.position.z=s.z;hm.textContent='₹'+String(money).padStart(8,'0')}});
clouds.forEach(function(c){c.position.x+=dt*3;if(c.position.x>450)c.position.x=-450});
var gm=(8*60+24+now/3000)%1440;clk.textContent=String(Math.floor(gm/60)).padStart(2,'0')+':'+String(Math.floor(gm%60)).padStart(2,'0');
tick+=dt;if(tick>.08&&room){tick=0;room.presence({x:+pp.x.toFixed(1),z:+pp.z.toFixed(1),h:+(drv?drv.h:ang).toFixed(2),d:drv?cars.indexOf(drv):-1,k:myCol,m:moving}).catch(function(){});sync()}
mmT+=dt;if(mmT>.1){mmT=0;drawMap(pp)}
var d=drv?(drv.type===3?11:15):10,cx=pp.x+Math.sin(yaw)*Math.cos(pitch)*d,cz=pp.z+Math.cos(yaw)*Math.cos(pitch)*d,cy=Math.sin(pitch)*d+2.2;
cam.position.set(cx,cy,cz);cam.lookAt(pp.x,2,pp.z);
if(window.skyDome)window.skyDome.position.copy(cam.position);
sun.position.set(pp.x+50,45,pp.z+30);sun.target.position.copy(pp);
ren.render(scene,cam)}
requestAnimationFrame(loop);
